name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Build, Lint & Unit Tests
  # -------------------------------------------------------------
  backend-test:
    name: Backend Test & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Unit & Integration Tests
        run: |
          chmod +x ./mvnw
          ./mvnw clean test -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # -------------------------------------------------------------
  # Job 2: Frontend Build & Type Check
  # -------------------------------------------------------------
  frontend-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard Bundle
        run: npm run build

      - name: Upload Dashboard Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

  # -------------------------------------------------------------
  # Job 3: Docker Container Build
  # -------------------------------------------------------------
  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: amazon-shortlink:latest

  # -------------------------------------------------------------
  # Job 4: Deploy to AWS (Main Branch Only)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to AWS S3 & CloudFront
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Dashboard Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/

      - name: Configure AWS Credentials (OIDC / IAM Role)
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsDeployment

      - name: Sync Dashboard to S3 & Invalidate CloudFront
        continue-on-error: true
        run: |
          echo "Deploying dashboard static assets to S3 and invalidating CloudFront..."
          # aws s3 sync dashboard/dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DIST_ID }} --paths "/*"
          echo "Deployment step ready for production credentials."
